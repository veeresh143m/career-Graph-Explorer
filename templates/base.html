<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Career Graph Explorer" }}</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin: 0; color: #111827; background: #f8fafc; }
      .page { max-width: 980px; margin: 0 auto; padding: 24px; }
      header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 18px; padding-bottom: 18px; }
      a { color: #2563eb; text-decoration: none; }
      a:hover { text-decoration: underline; }
      h1, h2, h3 { margin: 0; }
      .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); }
      .grid { display: grid; gap: 20px; }
      .grid-2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      .list { list-style: none; padding: 0; margin: 0; }
      .list li { padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
      .list li:last-child { border-bottom: none; }
      .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: #eef2ff; border-radius: 999px; font-size: 0.95rem; }
      .button { display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 12px; border: none; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
      .button.secondary { background: #f8fafc; color: #111827; border: 1px solid #cbd5e1; }
      .input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 1rem; }
      .section { margin-top: 20px; }
      .muted { color: #6b7280; }
      .section-title { font-size: 1rem; color: #374151; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 12px; }
      .error { color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; padding: 18px; border-radius: 14px; }
      .footer { margin-top: 32px; font-size: 0.95rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <a href="/"><h1>Career Graph Explorer</h1></a>
          <p class="muted">Explore roles, skills, and career-learning relationships.</p>
        </div>
        <form action="/search" method="get" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
          <input class="input" type="search" name="q" placeholder="Search roles, skills, courses" aria-label="Search" />
          <button class="button" type="submit">Search</button>
        </form>
      </header>
      {% block content %}{% endblock %}
      <footer class="footer">Built with Python, Flask, and CognoDB / Neo4j.</footer>
    </div>
  </body>
</html>
